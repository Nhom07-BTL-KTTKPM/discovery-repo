spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: discovery-service

server:
  port: ${SERVER_PORT}

eureka:
  instance:
    hostname: ${EUREKA_HOST}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION}
    eviction-interval-timer-in-ms: ${EUREKA_EVICTION_INTERVAL_MS}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
